name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-libvpx

      - name: Setup libvpx environment
        shell: pwsh
        run: |
          # Get MSYS2 installation path
          $msys2Path = "D:\a\_temp\msys64"
          
          # Set environment variables for libvpx
          echo "VPX_LIB_DIR=$msys2Path\mingw64\lib" >> $env:GITHUB_ENV
          echo "VPX_INCLUDE_DIR=$msys2Path\mingw64\include" >> $env:GITHUB_ENV
          echo "VPX_NO_PKG_CONFIG=1" >> $env:GITHUB_ENV
          
          # Add to PATH for DLLs
          echo "$msys2Path\mingw64\bin" >> $env:GITHUB_PATH

      - name: Install Frontend dependencies
        run: npm install

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPX_NO_PKG_CONFIG: '1'
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
