name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'c82f74667287d3dc386bce81e44964370c91a289'

      - name: Install libvpx (static)
        shell: pwsh
        run: |
          vcpkg install libvpx:x64-windows-static
          
          # Get vcpkg root
          $vcpkgRoot = $env:VCPKG_ROOT
          $libDir = "$vcpkgRoot\installed\x64-windows-static\lib"
          $includeDir = "$vcpkgRoot\installed\x64-windows-static\include"
          
          # Debug: List files in lib directory
          Write-Host "=== Files in lib directory ==="
          Get-ChildItem -Path $libDir -Recurse
          
          Write-Host "=== Files in include directory ==="
          Get-ChildItem -Path $includeDir -Recurse
          
          # Copy vpx.lib to libvpx.lib (Rust looks for libvpx)
          if (Test-Path "$libDir\vpx.lib") {
            Copy-Item "$libDir\vpx.lib" "$libDir\libvpx.lib" -Force
            Write-Host "Copied vpx.lib to libvpx.lib"
          }
          
          # Verify the file exists
          Write-Host "=== Verifying libvpx.lib ==="
          if (Test-Path "$libDir\libvpx.lib") {
            Write-Host "libvpx.lib exists!"
            Get-Item "$libDir\libvpx.lib"
          } else {
            Write-Host "ERROR: libvpx.lib not found!"
            exit 1
          }

      - name: Install Frontend dependencies
        run: npm install

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPX_LIB_DIR: ${{ github.workspace }}\vcpkg\installed\x64-windows-static\lib
          VPX_INCLUDE_DIR: ${{ github.workspace }}\vcpkg\installed\x64-windows-static\include
          VPX_VERSION: "1.14.1"
          VPX_STATIC: "1"
          VPX_NO_PKG_CONFIG: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
