name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 'c82f74667287d3dc386bce81e44964370c91a289'

      - name: Install libvpx (static)
        shell: pwsh
        run: |
          vcpkg install libvpx:x64-windows-static
          
          # Set environment variables for static linking
          $vcpkgRoot = "$env:VCPKG_ROOT"
          $libDir = "$vcpkgRoot\installed\x64-windows-static\lib"
          
          # Debug: List files in lib directory
          Write-Host "Files in lib directory:"
          Get-ChildItem -Path $libDir
          
          # Rename vpx.lib to libvpx.lib if needed
          if (Test-Path "$libDir\vpx.lib") {
            Copy-Item "$libDir\vpx.lib" "$libDir\libvpx.lib"
            Write-Host "Copied vpx.lib to libvpx.lib"
          }
          
          echo "VPX_LIB_DIR=$libDir" >> $env:GITHUB_ENV
          echo "VPX_INCLUDE_DIR=$vcpkgRoot\installed\x64-windows-static\include" >> $env:GITHUB_ENV
          echo "VPX_VERSION=1.14.1" >> $env:GITHUB_ENV
          echo "VPX_STATIC=1" >> $env:GITHUB_ENV
          echo "VPX_NO_PKG_CONFIG=1" >> $env:GITHUB_ENV

      - name: Install Frontend dependencies
        run: npm install

      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUSTFLAGS: "-C target-feature=+crt-static"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'App v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
